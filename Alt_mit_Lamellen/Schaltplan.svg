<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Arial, sans-serif">
  <title>Fensterluefter - Verkabelung</title>
  <rect width="900" height="520" fill="#FBF7EF"/>
  <text x="30" y="40" font-size="22" font-weight="600" fill="#3A2E22">Verkabelung Fensterlüfter</text>
  <text x="30" y="64" font-size="14" fill="#7A6A58">Nur 12 V Kleinspannung – keine 230-V-Arbeiten</text>

  <!-- Netzteil -->
  <rect x="30" y="110" width="190" height="90" rx="10" fill="#FCEBC8" stroke="#BA7517" stroke-width="2"/>
  <text x="125" y="145" font-size="17" font-weight="600" fill="#633806" text-anchor="middle">12-V-Steckernetzteil</text>
  <text x="125" y="168" font-size="14" fill="#854F0B" text-anchor="middle">mind. 2 A, besser 3 A</text>
  <text x="125" y="188" font-size="13" fill="#854F0B" text-anchor="middle">Stecker ab, Polarität messen</text>

  <!-- FLY Board -->
  <rect x="330" y="90" width="240" height="330" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
  <text x="450" y="125" font-size="18" font-weight="600" fill="#26215C" text-anchor="middle">FLY-Super8 Pro</text>
  <text x="450" y="146" font-size="13" fill="#534AB7" text-anchor="middle">STM32H723 · liegt innen auf der Fensterbank</text>

  <rect x="330" y="160" width="70" height="44" rx="6" fill="#FFFFFF" stroke="#534AB7"/>
  <text x="365" y="180" font-size="13" font-weight="600" fill="#26215C" text-anchor="middle">POWER</text>
  <text x="365" y="196" font-size="11" fill="#534AB7" text-anchor="middle">+  −</text>

  <rect x="500" y="200" width="70" height="44" rx="6" fill="#FFFFFF" stroke="#534AB7"/>
  <text x="535" y="220" font-size="13" font-weight="600" fill="#26215C" text-anchor="middle">FAN0</text>
  <text x="535" y="236" font-size="11" fill="#534AB7" text-anchor="middle">PA0 · Jumper VIN</text>

  <rect x="500" y="320" width="70" height="44" rx="6" fill="#FFFFFF" stroke="#534AB7"/>
  <text x="535" y="340" font-size="13" font-weight="600" fill="#26215C" text-anchor="middle">FAN1</text>
  <text x="535" y="356" font-size="11" fill="#534AB7" text-anchor="middle">PA1 · Jumper VIN</text>

  <text x="345" y="395" font-size="12" fill="#534AB7">USB = nur zum Aufspielen der Firmware</text>

  <!-- Power wires -->
  <path d="M220 145 H300 V172 H330" fill="none" stroke="#D0021B" stroke-width="3"/>
  <path d="M220 175 H290 V192 H330" fill="none" stroke="#222" stroke-width="3"/>
  <text x="236" y="138" font-size="12" fill="#A32D2D">+12 V (rot)</text>
  <text x="226" y="216" font-size="12" fill="#333">GND (schwarz)</text>

  <!-- Supply group -->
  <rect x="660" y="150" width="215" height="140" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
  <text x="767" y="176" font-size="16" font-weight="600" fill="#04342C" text-anchor="middle">Zuluft (Teil 04)</text>
  <g fill="#FFFFFF" stroke="#0F6E56">
    <circle cx="690" cy="215" r="17"/><circle cx="735" cy="215" r="17"/><circle cx="780" cy="215" r="17"/><circle cx="825" cy="215" r="17"/>
    <circle cx="757" cy="258" r="13"/>
  </g>
  <text x="767" y="284" font-size="12" fill="#085041" text-anchor="middle">4× 50 mm + 1× 40 mm, parallel</text>
  <path d="M570 214 H620 V200 H660" fill="none" stroke="#D0021B" stroke-width="3"/>
  <path d="M570 230 H630 V240 H660" fill="none" stroke="#222" stroke-width="3"/>

  <!-- Exhaust group -->
  <rect x="660" y="310" width="215" height="140" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="2"/>
  <text x="767" y="336" font-size="16" font-weight="600" fill="#4A1B0C" text-anchor="middle">Abluft (Teil 06)</text>
  <g fill="#FFFFFF" stroke="#993C1D">
    <circle cx="700" cy="372" r="13"/><circle cx="745" cy="372" r="13"/><circle cx="790" cy="372" r="13"/>
    <circle cx="700" cy="410" r="13"/><circle cx="745" cy="410" r="13"/><circle cx="790" cy="410" r="13"/>
  </g>
  <text x="767" y="442" font-size="12" fill="#712B13" text-anchor="middle">6× 40 mm, parallel</text>
  <path d="M570 334 H620 V360 H660" fill="none" stroke="#D0021B" stroke-width="3"/>
  <path d="M570 350 H630 V400 H660" fill="none" stroke="#222" stroke-width="3"/>

  <!-- notes -->
  <text x="30" y="250" font-size="14" font-weight="600" fill="#3A2E22">So verbindest du eine Gruppe:</text>
  <text x="30" y="274" font-size="13" fill="#5A4A38">1. Alle roten Lüfterkabel verdrillen</text>
  <text x="30" y="294" font-size="13" fill="#5A4A38">2. + eine rote Ader zum Board anlöten</text>
  <text x="30" y="314" font-size="13" fill="#5A4A38">3. Dasselbe mit allen schwarzen</text>
  <text x="30" y="334" font-size="13" fill="#5A4A38">4. Schrumpfschlauch drüber</text>
  <text x="30" y="364" font-size="13" fill="#5A4A38">Kabel Panel → Board: ca. 1–1,5 m,</text>
  <text x="30" y="384" font-size="13" fill="#5A4A38">2 Adern, ab 0,25 mm² reicht</text>
  <text x="30" y="414" font-size="13" fill="#A32D2D">Rot = Plus, Schwarz = Minus.</text>
  <text x="30" y="434" font-size="13" fill="#A32D2D">Falsch herum laufen die Lüfter nicht.</text>
  <text x="30" y="490" font-size="12" fill="#7A6A58">Stromverbrauch gesamt ca. 1,3 A bei 12 V (≈ 15 W bei Vollgas, deutlich weniger bei 60–70 %)</text>
</svg>
